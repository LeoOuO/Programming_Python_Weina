<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 工坊</title>
<script src="_vendor/skulpt.min.js"></script>
<script src="_vendor/skulpt-stdlib.js"></script>
<style>
:root{--bg:#fdf6f0;--panel:#fff;--ink:#2b2b3a;--soft:#6b6b80;--line:#e8dfd6;
  --pink:#ff6fa3;--pinkbg:#ffe6ef;--mint:#2bb39a;--mintbg:#e3f6f1;--sky:#4a8fe7;--skybg:#e6f0fd;--sun:#ffb347;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
header{background:linear-gradient(135deg,#ff8fb8,#ffb347);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:.02em}
header .who{font-size:15px;opacity:.95}
header .sp{flex:1}
#testbtn{font-family:var(--sans);font-size:13px;padding:5px 12px;border-radius:16px;border:1.5px solid rgba(255,255,255,.7);
  background:transparent;color:#fff;cursor:pointer}
body.test #testbtn{background:#fff;color:#c2255c;border-color:#fff}
#testbar{display:none;background:#fff3cd;color:#7a4b00;font-size:14px;padding:6px 24px;border-bottom:1px solid #f0d78a}
body.test #testbar{display:block}
header input{font-size:16px;padding:6px 12px;border:none;border-radius:20px;width:150px;font-family:var(--sans)}
.wrap{max-width:1300px;margin:0 auto;padding:16px 20px 60px}
.presets{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.presets button{font-family:var(--sans);font-size:15px;padding:9px 16px;border-radius:24px;border:2px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--ink);transition:.15s}
.presets button:hover{border-color:var(--pink);color:var(--pink)}
.presets button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.box .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#faf5f0;border-bottom:2px solid var(--line);font-size:14px;color:var(--soft)}
.box .bar b{color:var(--ink);font-size:15px}
.box .bar .sp{flex:1}
textarea#code{width:100%;height:440px;border:none;padding:14px 16px;font-family:var(--mono);font-size:16px;line-height:1.6;
  resize:vertical;background:#fffdfa;color:var(--ink);tab-size:4;outline:none}
button.run{font-family:var(--sans);font-size:17px;font-weight:700;padding:10px 26px;border:none;border-radius:24px;
  background:var(--mint);color:#fff;cursor:pointer;box-shadow:0 3px 0 #1e8a75;transition:.1s}
button.run:active{transform:translateY(2px);box-shadow:0 1px 0 #1e8a75}
button.run:disabled{opacity:.5;cursor:wait}
button.stop{font-family:var(--sans);font-size:17px;font-weight:700;padding:10px 22px;border:none;border-radius:24px;
  background:#d43d3d;color:#fff;cursor:pointer;box-shadow:0 3px 0 #9c2a2a}
button.stop[hidden]{display:none}
button.mini{font-family:var(--sans);font-size:13px;padding:5px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;color:var(--soft)}
button.mini:hover{border-color:var(--sky);color:var(--sky)}
#out{min-height:220px;max-height:440px;overflow:auto;padding:14px 16px;font-family:var(--mono);font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:#1f2430;color:#e9edf4}
#out .raw{color:#b9c2cf;font-size:13px;opacity:.9}
#out .err{color:#ff8a8a}
#out .sys{color:#8fa8c8}
#out .ask{display:flex;gap:8px;align-items:center;margin:6px 0}
#out .ask input{flex:1;font-family:var(--mono);font-size:16px;padding:6px 10px;border-radius:6px;border:2px solid var(--sky);background:#fff;color:var(--ink)}
#turtle-canvas{display:block;margin:0 auto;background:#fff}
#turtle-canvas canvas{display:block;margin:0 auto}
.hint{padding:10px 16px;font-size:14px;color:var(--soft);background:#faf5f0;border-top:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:24px;font-size:14px;transition:transform .25s;pointer-events:none;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>Python 工坊</h1>
  <span class="who">這是 <input id="who" placeholder="你的名字" autocomplete="off"> 的作品</span>
  <span class="sp"></span>
  <button id="testbtn" title="老師試用：不儲存任何東西">測試模式</button>
</header>
<div id="testbar">測試模式：程式碼和名字都不會儲存，關掉這個模式後會回到學生的存檔。</div>

<div class="wrap">
  <div class="presets" id="presets"></div>

  <div class="grid">
    <div class="box">
      <div class="bar"><b>✏️ 程式碼</b><span>改改看，然後按執行</span><span class="sp"></span>
        <button class="mini" id="reset">還原這一個</button>
        <button class="mini" id="save">💾 下載我的程式</button>
        <button class="run" id="run">▶ 執行</button>
        <button class="stop" id="stop" hidden>■ 停止</button></div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="hint">小技巧：<b>Ctrl+Enter</b>（Mac 是 <b>⌘+Enter</b>）也可以執行。程式會自動存在這個瀏覽器裡，關掉不會消失。</div>
    </div>
    <div class="box">
      <div class="bar"><b>📺 結果</b><span class="sp"></span><button class="mini" id="clear">清除</button></div>
      <div id="out"></div>
      <div id="turtle-canvas"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ======================= 範例程式（老師可以直接改這裡） =======================
const PRESETS = [
{ name: "① 讓電腦跟你說話", code:
`# 第一支程式：電腦會照你寫的說話
print("哈囉")
print("這是我的第一支程式")

name = input("你叫什麼名字？")
print("嗨，" + name)

age = input("你幾歲？")
print(name + " 今年 " + age + " 歲")
` },
{ name: "② 猜數字遊戲", code:
`# 電腦偷偷想一個數字，你來猜
import random

answer = random.randint(1, 20)   # 1 到 20 之間
count = 0

print("我想了一個 1～20 的數字，猜猜看")

while True:
    guess = int(input("你猜："))
    count = count + 1
    if guess < answer:
        print("太小了")
    elif guess > answer:
        print("太大了")
    else:
        print("猜中了，你猜了 " + str(count) + " 次")
        break
` },
{ name: "③ 彩虹螺旋", code:
`# 用畫筆畫出彩虹螺旋（改改顏色和數字看看！）
import turtle

t = turtle.Turtle()
t.speed(0)

colors = ["red", "orange", "yellow", "green", "blue", "purple"]

for i in range(120):
    t.pencolor(colors[i % 6])   # 每一步換一個顏色
    t.forward(i * 2)            # 越走越長
    t.left(59)                  # 轉一個角度（改成 90 或 121 試試）
` },
{ name: "④ 我的心理測驗", code:
`# 自己出題目的心理測驗（把問題和答案換成你的！）
print("你是哪一種動物？")
score = 0

a = input("放假想做什麼？ 1:睡覺  2:出去玩  3:看影片  ")
if a == "2":
    score = score + 2
elif a == "3":
    score = score + 1

b = input("喜歡哪種食物？ 1:肉  2:蔬菜  3:甜點  ")
if b == "1":
    score = score + 2
elif b == "3":
    score = score + 1

c = input("朋友形容你是？ 1:安靜  2:活潑  3:搞笑  ")
if c == "2":
    score = score + 2
elif c == "3":
    score = score + 1

print("")
if score >= 5:
    print("小狗：熱情又愛玩")
elif score >= 3:
    print("貓咪：有自己的想法")
else:
    print("烏龜：慢慢來但很穩")
` },
{ name: "⑤ 空白（自己寫）", code:
`# 在這裡寫你自己的程式
print("hello")
` },
{ name: "⑥ 剪刀石頭布", code:
`# 剪刀石頭布：電腦隨機出拳，你輸入你的
import random

choices = ["剪刀", "石頭", "布"]
computer = random.choice(choices)      # 電腦從清單裡隨機挑一個
me = input("你出什麼？（剪刀 / 石頭 / 布）")

print("電腦出：" + computer)

if me == computer:
    print("平手")
elif me == "剪刀" and computer == "布":
    print("你贏了")
elif me == "石頭" and computer == "剪刀":
    print("你贏了")
elif me == "布" and computer == "石頭":
    print("你贏了")
else:
    print("你輸了")
` },
{ name: "⑦ 抽籤機", code:
`# 抽籤機：把選項放進清單，讓電腦幫你決定
import random

dinner = ["滷肉飯", "拉麵", "披薩", "水餃", "咖哩"]

print("今天晚餐吃：" + random.choice(dinner))

# 想抽三次就用重複做
for i in range(3):
    print("第", i + 1, "次抽到：" + random.choice(dinner))
` },
];
// ==========================================================================

const $ = s => document.querySelector(s);
const codeEl = $("#code"), out = $("#out"), runBtn = $("#run"), stopBtn = $("#stop");
// running-state: `gen` tags each run so output from an aborted run is ignored;
// `pendingReject` lets 停止 cancel an input() that is still waiting
let running = false, gen = 0, stopReq = false, pendingReject = null;
let cur = 0;
const KEY = i => "pyplay-code-" + i;
// 測試模式（老師試用）：所有 localStorage 讀寫都跳過，學生的存檔不會被動到。
// 開啟方式：右上角按鈕，或網址加 ?test=1
let TEST = /[?&]test=1/.test(location.search);
const store = {
  get: k => { if(TEST) return null; try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: (k, v) => { if(TEST) return; try{ localStorage.setItem(k, v); }catch(e){} },
  del: k => { if(TEST) return; try{ localStorage.removeItem(k); }catch(e){} },
};

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1500); }
function print(text, cls){
  const span = document.createElement("span"); if(cls) span.className = cls;
  span.textContent = text; out.appendChild(span); out.scrollTop = out.scrollHeight;
}

// ---- 範例按鈕 ----
PRESETS.forEach((p, i) => {
  const b = document.createElement("button"); b.textContent = p.name;
  b.addEventListener("click", () => load(i)); $("#presets").appendChild(b);
});
function load(i){
  cur = i;
  [...$("#presets").children].forEach((b, k) => b.classList.toggle("on", k === i));
  const saved = store.get(KEY(i));
  codeEl.value = saved !== null ? saved : PRESETS[i].code;
  out.innerHTML = ""; $("#turtle-canvas").innerHTML = "";
}
codeEl.addEventListener("input", () => store.set(KEY(cur), codeEl.value));
$("#reset").addEventListener("click", () => { codeEl.value = PRESETS[cur].code; store.del(KEY(cur)); toast("已還原"); });
$("#clear").addEventListener("click", () => { if(running) stop(); out.innerHTML = ""; $("#turtle-canvas").innerHTML = ""; });
function stop(){
  if(!running) return;
  stopReq = true;
  if(pendingReject){ pendingReject(new Error("Stopped")); pendingReject = null; }
}
stopBtn.addEventListener("click", stop);
$("#who").value = store.get("pyplay-who") || "";
$("#who").addEventListener("input", () => store.set("pyplay-who", $("#who").value));

// ---- 測試模式切換 ----
function applyTest(){
  document.body.classList.toggle("test", TEST);
  $("#testbtn").textContent = TEST ? "測試模式：開" : "測試模式";
  $("#who").value = store.get("pyplay-who") || "";
  load(cur);   // 開：載入原始範例；關：載回學生存檔
}
$("#testbtn").addEventListener("click", () => {
  if(running) stop();
  TEST = !TEST; applyTest();
  toast(TEST ? "測試模式：不會儲存任何東西" : "已回到一般模式");
});

// ---- 下載 .py ----
$("#save").addEventListener("click", () => {
  const who = ($("#who").value || "我").trim();
  const name = who + "-" + PRESETS[cur].name.replace(/^[①②③④⑤⑥⑦]\s*/, "").replace(/[（）()\s]/g, "") + ".py";
  const blob = new Blob(["# " + who + " 的作品\n" + codeEl.value], {type:"text/x-python"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); toast("已下載 " + name);
});

// ---- input()：在結果區出現一個輸入框，等使用者按 Enter ----
function askInput(prompt){
  return new Promise((resolve, reject) => {
    pendingReject = reject;
    const row = document.createElement("div"); row.className = "ask";
    const lab = document.createElement("span"); lab.textContent = prompt || "";
    const inp = document.createElement("input"); inp.placeholder = "在這裡輸入，然後按 Enter";
    row.appendChild(lab); row.appendChild(inp); out.appendChild(row);
    out.scrollTop = out.scrollHeight; inp.focus();
    inp.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      const v = inp.value;
      row.replaceWith(document.createTextNode((prompt || "") + v + "\n"));
      pendingReject = null; resolve(v);
    });
  });
}

// ---- 執行 ----
function builtinRead(x){
  if(Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "找不到模組：" + x;
  return Sk.builtinFiles["files"][x];
}
async function run(){
  if(running) return;
  const my = ++gen; running = true; stopReq = false; pendingReject = null;
  out.innerHTML = ""; $("#turtle-canvas").innerHTML = "";
  runBtn.disabled = true; runBtn.textContent = "執行中…"; stopBtn.hidden = false;
  Sk.configure({
    output: t => { if(my === gen) print(t); },
    read: builtinRead,
    inputfun: askInput,
    inputfunTakesPrompt: true,
    __future__: Sk.python3,
    execLimit: 20000,           // 20 秒保護，避免無窮迴圈卡死
    yieldLimit: 100,            // 每 100ms 讓出一次，停止鍵才有機會插進來
  });
  (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = "turtle-canvas";
  Sk.TurtleGraphics.width = 520; Sk.TurtleGraphics.height = 420;
  try{
    await Sk.misceval.asyncToPromise(
      () => Sk.importMainWithBody("<stdin>", false, codeEl.value, true),
      { "*": () => { if(stopReq) throw new Error("Stopped"); } });
    if(my === gen) print("\n（程式結束）", "sys");
  }catch(e){
    // 先用一句中文說是哪一類問題，下面再附 Python 原本的完整錯誤（含行號／traceback）
    const raw = (e && e.toString) ? e.toString() : String(e);
    let line = "", lineno = 0;
    try{ if(e.traceback && e.traceback.length){ lineno = e.traceback[0].lineno; line = "（第 " + lineno + " 行）"; } }catch(x){}
    // Skulpt reports a missing indent after "if/for/while ...:" as a plain SyntaxError; detect it ourselves
    const prev = lineno > 1 ? (codeEl.value.split("\n")[lineno - 2] || "").trim() : "";
    const afterColon = /SyntaxError/.test(raw) && prev.endsWith(":");
    if(my !== gen) return;
    let msg;
    if(stopReq || /Stopped/.test(raw)) msg = null;
    else if(/TimeLimitError/.test(raw)) msg = "程式跑太久被停下來了" + line + "，是不是迴圈沒有停下來的條件？";
    else if(/IndentationError/.test(raw)) msg = "縮排錯誤" + line + "：這一行前面的空格數不對。";
    else if(afterColon) msg = "縮排錯誤" + line + "：上一行以冒號結尾，這一行前面要空 4 格。";
    else if(/SyntaxError/.test(raw)) msg = "語法錯誤" + line + "：有地方打錯了，常見是少了引號、括號或冒號。";
    else if(/NameError/.test(raw)) msg = "名字錯誤" + line + "：用到一個還沒定義（或拼錯）的名字。";
    else if(/ValueError.*int/.test(raw)) msg = "轉換錯誤" + line + "：int() 拿到的不是數字（如果是 input() 來的，檢查你輸入了什麼）。";
    else if(/TypeError/.test(raw)) msg = "型別錯誤" + line + "：把兩種不同的東西混在一起了，例如文字 + 數字。";
    else if(/ZeroDivisionError/.test(raw)) msg = "除以零" + line + "：不能除以 0。";
    else if(/IndexError/.test(raw)) msg = "索引錯誤" + line + "：清單裡沒有這個位置。";
    else if(/ImportError|找不到模組/.test(raw)) msg = "找不到模組" + line + "：import 的名字打錯了，或這裡沒有這個模組。";
    else msg = "程式出錯了" + line + "。";
    if(msg === null) print("\n（已停止）", "sys");
    else{ print("\n出錯了：" + msg + "\n", "err"); print("Python 原始錯誤訊息：\n" + raw + "\n", "raw"); }
  }
  running = false; pendingReject = null;
  runBtn.disabled = false; runBtn.textContent = "▶ 執行"; stopBtn.hidden = true;
}
runBtn.addEventListener("click", run);
document.addEventListener("keydown", e => { if((e.metaKey || e.ctrlKey) && e.key === "Enter"){ e.preventDefault(); run(); } });
codeEl.addEventListener("keydown", e => {   // Tab 縮排四格
  if(e.key === "Tab"){ e.preventDefault(); const s = codeEl.selectionStart;
    codeEl.value = codeEl.value.slice(0, s) + "    " + codeEl.value.slice(codeEl.selectionEnd);
    codeEl.selectionStart = codeEl.selectionEnd = s + 4; codeEl.dispatchEvent(new Event("input")); }
});
load(0);
applyTest();
</script>
</body>
</html>
