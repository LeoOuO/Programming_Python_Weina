</div></div>
<div id="hud">← → 翻頁 · <b>O</b> 總覽 · <b>N</b> 備註 · <b>F</b> 全螢幕</div>

<script>
"use strict";

/* ============================================================
   1. Python syntax highlighting (runs on plain text in <pre><code>)
   ============================================================ */
const KW = new Set(["and","or","not","if","elif","else","for","while","in","def","return",
  "break","continue","import","from","as","True","False","None","global","pass","lambda","is"]);
const BI = new Set(["print","input","int","float","str","len","range","list","map","sum","max",
  "min","sorted","abs","append","pop","split","join","upper","lower","ord","chr","type","set","dict",
  "random","randint","turtle","Turtle","speed","pencolor","forward","left","right"]);

function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function highlight(text){
  let out = "";
  const lines = text.split("\n");
  lines.forEach((line, li) => {
    let i = 0, buf = "";
    while(i < line.length){
      const ch = line[i];
      if(ch === "#"){ buf += '<span class="c">' + esc(line.slice(i)) + "</span>"; i = line.length; continue; }
      if(ch === '"' || ch === "'"){
        let j = i + 1;
        while(j < line.length && line[j] !== ch) j++;
        buf += '<span class="s">' + esc(line.slice(i, j + 1)) + "</span>";
        i = j + 1; continue;
      }
      if(/[A-Za-z_]/.test(ch)){
        let j = i;
        while(j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
        const w = line.slice(i, j);
        buf += KW.has(w) ? '<span class="k">' + w + "</span>"
             : BI.has(w) ? '<span class="n">' + w + "</span>" : esc(w);
        i = j; continue;
      }
      if(/[0-9]/.test(ch)){
        let j = i;
        while(j < line.length && /[0-9.]/.test(line[j])) j++;
        buf += '<span class="n">' + line.slice(i, j) + "</span>";
        i = j; continue;
      }
      buf += esc(ch); i++;
    }
    out += buf + (li < lines.length - 1 ? "\n" : "");
  });
  return out;
}
document.querySelectorAll("pre > code").forEach(c => { c.innerHTML = highlight(c.textContent); });

/* ============================================================
   2. Interactive: code tracer
   ============================================================ */
document.querySelectorAll(".tracer").forEach(box => {
  const cfgEl = box.querySelector('script[type="application/json"]');
  if(!cfgEl) return;
  let cfg;
  try{ cfg = JSON.parse(cfgEl.textContent); }
  catch(e){ box.innerHTML = '<p style="color:#d43d3d">追蹤器設定格式有誤</p>'; return; }

  box.innerHTML = `
    <div class="tcode">${cfg.code.map(l => "<div>" + highlight(l) + "</div>").join("")}</div>
    <div class="tside">
      <table><thead><tr>${cfg.cols.map(c => "<th>" + esc(c) + "</th>").join("")}</tr></thead><tbody></tbody></table>
      <div class="say"></div>
      <div class="tbtns">
        <button data-prev>← 上一步</button>
        <button class="pri" data-next>下一步 →</button>
        <button data-rst>重來</button>
        <span class="step"></span>
      </div>
    </div>`;

  const lines = [...box.querySelectorAll(".tcode div")];
  const tb = box.querySelector("tbody");
  const say = box.querySelector(".say");
  const stepLbl = box.querySelector(".step");
  const bPrev = box.querySelector("[data-prev]"), bNext = box.querySelector("[data-next]");
  let at = 0;

  function render(){
    lines.forEach(l => l.classList.remove("lit"));
    tb.innerHTML = "";
    let lastSay = "";
    for(let k = 0; k < at; k++){
      const st = cfg.steps[k];
      if(st.row){
        const tr = document.createElement("tr");
        tr.innerHTML = st.row.map(v => "<td>" + esc(v) + "</td>").join("");
        tb.appendChild(tr);
      }
      if(st.say) lastSay = st.say;
    }
    if(at > 0){
      const cur = cfg.steps[at - 1];
      (cur.hl || []).forEach(n => lines[n - 1] && lines[n - 1].classList.add("lit"));
      say.textContent = cur.say || (cur.row ? "把這一列填進表格" : lastSay);
    }else{
      say.textContent = "按「下一步」開始一行一行看。";
    }
    stepLbl.textContent = at + " / " + cfg.steps.length;
    bPrev.disabled = at === 0;
    bNext.disabled = at === cfg.steps.length;
  }
  bNext.addEventListener("click", () => { if(at < cfg.steps.length){ at++; render(); } });
  bPrev.addEventListener("click", () => { if(at > 0){ at--; render(); } });
  box.querySelector("[data-rst]").addEventListener("click", () => { at = 0; render(); });
  render();
});

/* ============================================================
   3. Interactive: quiz
   ============================================================ */
function normAns(s){
  return String(s).trim().replace(/\s*,\s*/g, ",").replace(/[ \t]+/g, " ").replace(/^['"]|['"]$/g, "");
}
document.querySelectorAll(".quiz").forEach(q => {
  const want = q.dataset.answer || "";
  const input = q.querySelector("input");
  const btn = q.querySelector("button");
  const fb = q.querySelector(".fb");
  function check(){
    const ok = normAns(input.value).toLowerCase() === normAns(want).toLowerCase();
    fb.className = "fb on " + (ok ? "ok" : "no");
    fb.textContent = ok ? "✓ 對了" : "✗ 再想一下";
  }
  btn.addEventListener("click", check);
  input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.stopPropagation(); check(); } });
  input.addEventListener("keyup", e => e.stopPropagation());
});

/* ============================================================
   4. Interactive: tabs
   ============================================================ */
document.querySelectorAll(".tabs").forEach(t => {
  const bar = document.createElement("div");
  bar.className = "tabbar";
  t.insertBefore(bar, t.firstChild);
  const panes = [...t.querySelectorAll(".pane")];
  panes.forEach((p, i) => {
    const b = document.createElement("button");
    const h = p.querySelector("h4");
    b.textContent = h ? h.textContent.replace(/^\d+\)\s*/, "") : "第 " + (i + 1) + " 個";
    if(h) h.style.display = "none";
    b.addEventListener("click", () => {
      panes.forEach(x => x.classList.remove("on"));
      [...bar.children].forEach(x => x.classList.remove("on"));
      p.classList.add("on"); b.classList.add("on");
    });
    bar.appendChild(b);
  });
  if(panes.length){ panes[0].classList.add("on"); bar.children[0].classList.add("on"); }
});

/* ============================================================
   5. Interactive: checklist
   ============================================================ */
document.querySelectorAll("ul.check > li").forEach(li => {
  li.addEventListener("click", () => li.classList.toggle("done"));
});

/* ============================================================
   6. Deck engine: scaling, navigation, overview, notes
   ============================================================ */
const deck = document.getElementById("deck");
const slides = [...document.querySelectorAll(".slide")];
let part = "";
slides.forEach((s, i) => {
  s.dataset.n = (i + 1) + " / " + slides.length;
  const h1 = s.querySelector("h1");
  if(s.classList.contains("lead") && h1 && /^Part/.test(h1.textContent)){
    const h2 = s.querySelector("h2");
    part = h1.textContent.trim() + (h2 ? " · " + h2.textContent.trim() : "");
  }
  s.dataset.part = part || "Python 第 1 堂";
});

const thumbs = slides.map((s, i) => {
  const w = document.createElement("div");
  w.className = "thumb";
  w.dataset.i = i + 1;
  s.parentNode.insertBefore(w, s);
  w.appendChild(s);
  w.addEventListener("click", () => {
    if(document.body.classList.contains("ov")){ go(i); toggleOv(false); }
  });
  return w;
});

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle("on", k === cur));
  document.getElementById("bar").style.width = ((cur + 1) / slides.length * 100) + "%";
  if(history.replaceState) history.replaceState(null, "", "#" + (cur + 1));
}
function fit(){
  if(document.body.classList.contains("ov")){ deck.style.transform = ""; return; }
  const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = "scale(" + k + ")";
}
function toggleOv(force){
  const on = force === undefined ? !document.body.classList.contains("ov") : force;
  document.body.classList.toggle("ov", on);
  if(on) slides.forEach(s => s.classList.add("on"));
  else slides.forEach((s, k) => s.classList.toggle("on", k === cur));
  thumbs.forEach((t, k) => t.classList.toggle("here", on && k === cur));
  fit();
  if(on && thumbs[cur]) thumbs[cur].scrollIntoView({block:"center"});
}

addEventListener("resize", fit);
addEventListener("keydown", e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key;
  if(k === "ArrowRight" || k === " " || k === "PageDown"){ e.preventDefault(); toggleOv(false); go(cur + 1); }
  else if(k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); toggleOv(false); go(cur - 1); }
  else if(k === "Home"){ go(0); }
  else if(k === "End"){ go(slides.length - 1); }
  else if(k === "o" || k === "O"){ toggleOv(); }
  else if(k === "n" || k === "N"){ document.body.classList.toggle("notes"); }
  else if(k === "f" || k === "F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  else if(k === "Escape"){ toggleOv(false); }
});

const hud = document.getElementById("hud");
let hudT;
function pokeHud(){
  hud.classList.remove("fade");
  clearTimeout(hudT);
  hudT = setTimeout(() => hud.classList.add("fade"), 4000);
}
addEventListener("mousemove", pokeHud);
addEventListener("keydown", pokeHud);
pokeHud();

/* dev self-check: flag slides whose content would be clipped by the 1280x720 frame */
(function overflowCheck(){
  const bad = [];
  slides.forEach((s, i) => {
    const was = s.classList.contains("on");
    s.classList.add("on");
    if(s.scrollHeight > 722 || s.scrollWidth > 1282) bad.push(i + 1);
    if(!was) s.classList.remove("on");
  });
  if(bad.length) console.warn("[slides] 這幾頁內容超出版面，需要縮減或改用 sm / xs：", bad.join(", "));
  else console.info("[slides] 版面檢查通過，" + slides.length + " 頁都在框內。");
})();

function fromHash(){
  const n = parseInt((location.hash || "").slice(1), 10);
  return isFinite(n) && n > 0 ? n - 1 : 0;
}
addEventListener("hashchange", () => { const n = fromHash(); if(n !== cur) go(n); });
go(fromHash());
fit();
</script>
</body>
</html>
